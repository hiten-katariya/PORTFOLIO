<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(20, 24, 38, 0.9)"/>
      <stop offset="100%" stop-color="rgba(12, 14, 22, 0.95)"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Banner -->
  <rect x="30" y="24" width="1220" height="60" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <text x="56" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="18">Cryptographic Merkle Tree Verification Engine</text>
  <text x="580" y="59" fill="#818cf8" font-family="'IBM Plex Mono', monospace" font-size="11">HASH STANDARD: KECCAK-256 / SHA-256</text>
  <rect x="1060" y="40" width="166" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
  <text x="1143" y="58" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="11" text-anchor="middle">MERKLE PROOF: VALID</text>

  <!-- Tree Graph Canvas -->
  <rect x="30" y="104" width="1220" height="586" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)"/>

  <!-- Connecting Lines -->
  <!-- Root to Branch 1 & 2 -->
  <path d="M 640 210 L 390 320" stroke="rgba(99,102,241,0.6)" stroke-width="2.5" fill="none"/>
  <path d="M 640 210 L 890 320" stroke="rgba(99,102,241,0.6)" stroke-width="2.5" fill="none"/>

  <!-- Branch 1 to Leaf 1 & 2 -->
  <path d="M 390 360 L 260 480" stroke="rgba(16,185,129,0.6)" stroke-width="2" fill="none"/>
  <path d="M 390 360 L 520 480" stroke="rgba(16,185,129,0.6)" stroke-width="2" fill="none"/>

  <!-- Branch 2 to Leaf 3 & 4 -->
  <path d="M 890 360 L 760 480" stroke="rgba(16,185,129,0.6)" stroke-width="2" fill="none"/>
  <path d="M 890 360 L 1020 480" stroke="rgba(16,185,129,0.6)" stroke-width="2" fill="none"/>

  <!-- ROOT NODE -->
  <g transform="translate(480, 150)">
    <rect width="320" height="70" rx="12" fill="rgba(99,102,241,0.2)" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="28" fill="#a5b4fc" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12" text-anchor="middle">ROOT HASH (BLOCK HEADER)</text>
    <text x="160" y="52" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="11" text-anchor="middle">0x3f8a91bc74e2...88a4d</text>
  </g>

  <!-- BRANCH NODE 1 -->
  <g transform="translate(250, 310)">
    <rect width="280" height="60" rx="10" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="26" fill="#93c5fd" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="11" text-anchor="middle">BRANCH HASH: FARM &amp; MILL (H12)</text>
    <text x="140" y="46" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">0x91e847c2a3...19f0</text>
  </g>

  <!-- BRANCH NODE 2 -->
  <g transform="translate(750, 310)">
    <rect width="280" height="60" rx="10" fill="rgba(59,130,246,0.15)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="140" y="26" fill="#93c5fd" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="11" text-anchor="middle">BRANCH HASH: TRANSIT &amp; QUALITY (H34)</text>
    <text x="140" y="46" fill="#ffffff" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">0x762b90da1e...88cd</text>
  </g>

  <!-- LEAF 1: Farm Harvest -->
  <g transform="translate(140, 480)">
    <rect width="240" height="110" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12">LEAF 1: HARVEST CERT</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Geo: 30.9010&#176; N, 75.8573&#176; E</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Moisture Index: 11.4%</text>
    <text x="20" y="92" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9.5">Hash: 0x47b2...01e8</text>
  </g>

  <!-- LEAF 2: Quality Inspection -->
  <g transform="translate(400, 480)">
    <rect width="240" height="110" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12">LEAF 2: LAB ASSAY</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Protein: 13.8% (A-Grade)</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Organic Cert: Verified</text>
    <text x="20" y="92" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9.5">Hash: 0x90c1...f482</text>
  </g>

  <!-- LEAF 3: Transport IoT -->
  <g transform="translate(660, 480)">
    <rect width="240" height="110" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12">LEAF 3: IoT TRANSIT</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Continuous Temp: 19&#176;-23&#176;C</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Route Telemetry: No Breach</text>
    <text x="20" y="92" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9.5">Hash: 0x11a8...3b99</text>
  </g>

  <!-- LEAF 4: Silo Delivery -->
  <g transform="translate(920, 480)">
    <rect width="240" height="110" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12">LEAF 4: SILO DELIVERY</text>
    <text x="20" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Weight Check: 42,500 kg</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10">Discharge Gate: #04 Verified</text>
    <text x="20" y="92" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="9.5">Hash: 0x82f4...dd01</text>
  </g>

  <!-- Bottom Verification Footer -->
  <rect x="60" y="620" width="1160" height="46" rx="8" fill="rgba(99,102,241,0.1)" stroke="rgba(99,102,241,0.2)"/>
  <text x="80" y="648" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="11">MERKLE AUDIT PROOF: Validated against Ethereum Smart Contract at block #19,482,012 &#8226; Status: Zero Tampering Detected</text>
</svg>
