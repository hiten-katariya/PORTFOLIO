  <text x="646" y="264" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="9.5">contract BlockGrainProvenance {</text>
  <text x="658" y="282" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="9">  function verifyBatch(bytes32 _root) {</text>
