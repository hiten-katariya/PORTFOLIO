<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(18, 22, 36, 0.9)"/>
      <stop offset="100%" stop-color="rgba(10, 12, 20, 0.95)"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Top Navigation Header -->
  <rect x="30" y="24" width="1220" height="60" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)"/>
  <text x="56" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="18">Decentralized P2P Consensus Network Topology</text>
  <text x="640" y="59" fill="#38bdf8" font-family="'IBM Plex Mono', monospace" font-size="11">GLOBAL VALIDATORS: 48 NODES &#8226; SYNC: 100%</text>
  <rect x="1080" y="40" width="146" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)"/>
  <text x="1153" y="58" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="11" text-anchor="middle">EPOCH FINALITY</text>

  <!-- Network Topology Visual Area -->
  <rect x="30" y="104" width="760" height="586" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.07)"/>

  <!-- Network Hub Connections -->
  <g stroke="rgba(99,102,241,0.35)" stroke-width="1.5">
    <line x1="410" y1="390" x2="220" y2="240"/>
    <line x1="410" y1="390" x2="600" y2="240"/>
    <line x1="410" y1="390" x2="180" y2="480"/>
    <line x1="410" y1="390" x2="620" y2="480"/>
    <line x1="410" y1="390" x2="410" y2="560"/>
    <line x1="220" y1="240" x2="600" y2="240"/>
    <line x1="180" y1="480" x2="410" y2="560"/>
    <line x1="620" y1="480" x2="410" y2="560"/>
    <line x1="220" y1="240" x2="180" y2="480"/>
    <line x1="600" y1="240" x2="620" y2="480"/>
  </g>

  <!-- Central Validator Node -->
  <circle cx="410" cy="390" r="44" fill="url(#cyanPurple)" opacity="0.2"/>
  <circle cx="410" cy="390" r="28" fill="#6366f1"/>
  <text x="410" y="394" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="10" text-anchor="middle">PRIMARY</text>
  <text x="410" y="405" fill="#a5b4fc" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">NODE #01</text>

  <!-- Satellite Nodes -->
  <!-- Node A -->
  <circle cx="220" cy="240" r="22" fill="#0ea5e9"/>
  <text x="220" y="244" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VAL-02</text>
  <text x="220" y="278" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">LATENCY: 14ms</text>

  <!-- Node B -->
  <circle cx="600" cy="240" r="22" fill="#0ea5e9"/>
  <text x="600" y="244" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VAL-03</text>
  <text x="600" y="278" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">LATENCY: 18ms</text>

  <!-- Node C -->
