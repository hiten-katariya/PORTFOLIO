  <text x="180" y="484" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VAL-04</text>
  <text x="180" y="518" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">PEERS: 24</text>

  <!-- Node D -->
  <circle cx="620" cy="480" r="22" fill="#10b981"/>
  <text x="620" y="484" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VAL-05</text>
  <text x="620" y="518" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">PEERS: 22</text>

  <!-- Node E -->
  <circle cx="410" cy="560" r="22" fill="#8b5cf6"/>
  <text x="410" y="564" fill="#fff" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">VAL-06</text>
  <text x="410" y="598" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle">STATE: 100%</text>

  <!-- Right Panel: Live Ledger Blocks Stream -->
