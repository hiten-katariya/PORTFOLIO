  <g transform="translate(836, 170)">
    <rect width="390" height="88" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)"/>
    <text x="16" y="28" fill="#a5b4fc" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700">BLOCK #19,482,015 &#8226; FINALIZED</text>
    <text x="16" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10.5">Hash: 0x9fa1...4bc8 &#8226; Gas: 21,000</text>
    <text x="16" y="72" fill="#34d399" font-family="'Inter Tight', sans-serif" font-size="11">&#10003; 42 Supply-Chain Grain State Updates Confirmed</text>
  </g>

  <!-- Block Item 2 -->
  <g transform="translate(836, 274)">
    <rect width="390" height="88" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="28" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700">BLOCK #19,482,014 &#8226; FINALIZED</text>
    <text x="16" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10.5">Hash: 0x11e4...88a2 &#8226; Gas: 28,450</text>
    <text x="16" y="72" fill="#34d399" font-family="'Inter Tight', sans-serif" font-size="11">&#10003; Farmer Harvest DID Attestation Recorded</text>
  </g>

  <!-- Block Item 3 -->
  <g transform="translate(836, 378)">
    <rect width="390" height="88" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="28" fill="#e2e8f0" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700">BLOCK #19,482,013 &#8226; FINALIZED</text>
    <text x="16" y="50" fill="#94a3b8" font-family="'IBM Plex Mono', monospace" font-size="10.5">Hash: 0x48dc...310f &#8226; Gas: 19,800</text>
    <text x="16" y="72" fill="#34d399" font-family="'Inter Tight', sans-serif" font-size="11">&#10003; Laboratory Assay Certificate Cryptographically Signed</text>
