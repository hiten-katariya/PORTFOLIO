  <!-- Summary Box -->
  <g transform="translate(836, 482)">
    <rect width="390" height="186" rx="12" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.25)"/>
    <text x="20" y="32" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="14">ENTERPRISE SYSTEM GUARANTEES</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="'Inter Tight', sans-serif" font-size="12">&#8226; Byzantine Fault Tolerance across 48 validator nodes</text>
    <text x="20" y="84" fill="#cbd5e1" font-family="'Inter Tight', sans-serif" font-size="12">&#8226; Tamper-evident SHA-256 state tree linking</text>
    <text x="20" y="108" fill="#cbd5e1" font-family="'Inter Tight', sans-serif" font-size="12">&#8226; Sub-second cryptographic proof generation for audits</text>
    <text x="20" y="132" fill="#cbd5e1" font-family="'Inter Tight', sans-serif" font-size="12">&#8226; Automated smart contract settlement without intermediaries</text>
    <text x="20" y="162" fill="#64748b" font-family="'IBM Plex Mono', monospace" font-size="10">EVM PROTOCOL SPEC: v2.4.1-PRODUCTION</text>
  </g>
</svg>
